<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مياهي</title>
<meta name="description" content="متابعة عداد وفواتير الماء، محاكي الفاتورة وتعرفة 2027 — قراءة فقط">
<meta name="theme-color" content="#071A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مياهي">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071A2E; --surface:#0F2744; --surface-2:#14304F; --line:#1F3F63;
  --ink:#EAF3FC; --ink-2:#A9C6E2; --muted:#7F9DBD;
  --sky:#5CC8FF; --brand:#4DA3F5; --brand-ink:#D3E7FC; --brand-soft:#17375C;
  --warn:#FF9A52; --warn-soft:#3B2617;
  --good:#4CC98A; --good-soft:#103222;
  --bad:#FF7070; --bad-soft:#3B1818;
  --amber:#F0B24A; --amber-soft:#36290F;
  --bs:#B794F6;
  --hero-a:#1A6FC7; --hero-b:#0E3A7A;
  --t1:#5BB8E8; --t2:#3D8CEB; --t3:#FF9A52;
  --shadow:none;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#071A2E}
html,body{margin:0;color:var(--ink)}
body{background:linear-gradient(180deg,#071A2E 0%,#0B2C52 60%,#0E3A6B 100%) fixed;min-height:100vh}
body{font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
header.top img{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 8px rgba(30,111,224,.25)}
header.top .t{flex:1;min-width:0}
header.top h1{font-size:21px;margin:0;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:6px}
header.top h1 .bs{font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB02E,#F2711C);padding:1px 6px;border-radius:6px;letter-spacing:.5px}
header.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.tabs{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:528px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:30px;background:rgba(6,20,38,.88);border:1px solid rgba(160,210,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:12px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:500}
.tabs button{border-radius:24px!important;height:46px}
.tabs button.on{background:#1E7BE6;color:#fff;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-paid{background:var(--good-soft);color:var(--good)}
.chip-issued{background:var(--bad-soft);color:var(--bad)}
.chip-wait{background:var(--amber-soft);color:var(--amber)}
.chip-open{background:var(--brand-soft);color:var(--brand)}
.chip-t3{background:var(--warn-soft);color:var(--warn)}
.chip-ok{background:var(--good-soft);color:var(--good)}
/* hero */
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;border:0;position:relative;overflow:hidden;padding:16px 16px 18px}
.hero::after{content:"";position:absolute;inset:auto -10% -38px -10%;height:90px;background:radial-gradient(60% 60px at 50% 100%,rgba(255,255,255,.18),transparent);pointer-events:none}
.hero .hd{display:flex;align-items:center;gap:8px;font-size:13px}
.hero .hd .sp{flex:1}
.hero .hd .pill{background:rgba(255,255,255,.2);color:#fff}
.hero .hd .pill.t3{background:#FFF1E6;color:#C2410C}
.gauge{display:block;width:100%;max-width:300px;margin:4px auto 0;overflow:visible}
.gauge .lbl{fill:rgba(255,255,255,.85);font-size:10px;font-family:inherit}
.gcenter{text-align:center;margin-top:-58px;position:relative}
.gcenter .v{font-size:34px;font-weight:700;line-height:1}
.gcenter .v small{font-size:14px;font-weight:500;opacity:.85}
.gcenter .s{font-size:12px;opacity:.85;margin-top:4px}
.hero .bill{display:flex;gap:10px;margin-top:16px}
.hero .bill > div{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}
.hero .bill .k{font-size:12px;opacity:.85}
.hero .bill .v{font-size:22px;font-weight:700}
.hero .bill .v small{font-size:12px;font-weight:500;opacity:.85}
.hero .bill > div.main{background:#fff;color:#123B7A}
.hero .bill > div.main .k{color:#47607E;opacity:1}
.status{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:18px;margin:12px 0}
.status b{font-weight:700}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.status .ic{font-size:18px;line-height:1.2}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.trio .kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);text-align:center}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:500;color:var(--ink-2)}
.kpi .d{font-size:11px;font-weight:600;margin-top:2px}
.up{color:var(--warn)} .down{color:var(--good)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .kpi{background:var(--surface-2);border-radius:16px;padding:10px 12px}
.reading{display:flex;align-items:center;gap:14px}
.reading .ic{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.reading .ic svg{width:24px;height:24px}
.reading .x{flex:1;min-width:0}
.reading .v{font-size:24px;font-weight:700;line-height:1.2}
.reading .v small{font-size:13px;font-weight:500;color:var(--ink-2)}
.reading .m{font-size:12px;color:var(--muted)}
.remind{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:14px;background:var(--amber-soft);color:var(--amber)}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:6px;direction:ltr}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--t2);min-height:3px}
.bars i.t3{background:var(--t3)} .bars i.cur{opacity:.45;outline:1.5px dashed var(--t2);outline-offset:-1.5px}
.bars-l{display:flex;gap:6px;direction:ltr;font-size:10px;color:var(--muted);margin-top:4px}
.bars-l span{flex:1;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:10px}
.row:first-of-type{border-top:0}
.row .l{color:var(--ink-2);font-size:14px}
.row .r{font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .bar{cursor:pointer}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:9px;
  white-space:nowrap;transform:translate(50%,-100%);opacity:0;transition:opacity .12s;z-index:2;line-height:1.4}
.tip.on{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--warn);vertical-align:3px}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .a{font-weight:600}
.list .b{color:var(--muted);font-size:12px}
.list .c{text-align:left;font-weight:600}
.list .d{text-align:left;font-size:12px;color:var(--muted)}
.more{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 0 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
.banner{font-size:12px;padding:8px 12px;border-radius:12px;margin-top:8px;background:var(--amber-soft);color:var(--amber);display:none}
.banner.on{display:block}
/* lock */
#lock{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg),var(--surface-2));display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:10}
#lock.on{display:flex}
#lock img{width:96px;height:96px;border-radius:24px;margin-bottom:12px;box-shadow:0 8px 24px rgba(30,111,224,.3)}
#lock h1{margin:0;font-size:22px}
#lock p{margin:4px 0 18px;color:var(--muted);font-size:14px;text-align:center}
.dots{display:flex;gap:14px;direction:ltr;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.dots i.f{background:var(--brand)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:8px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:26px;font-weight:500;cursor:pointer;box-shadow:var(--shadow)}
.pad button:active{background:var(--brand-soft)}
.pad .ghost{border:0;background:none;box-shadow:none;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;margin-top:18px;cursor:pointer}
.rec{display:none;width:100%;max-width:320px;margin-top:12px}
.rec.on{display:block}
.rec input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;direction:ltr;text-align:center}
.btn{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
/* settings sheet */
#sheet{position:fixed;inset:0;background:rgba(5,10,20,.45);display:none;align-items:flex-end;z-index:9}
#sheet.on{display:flex}
#sheet .in{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:17px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tog input{width:44px;height:26px;accent-color:var(--brand)}
.sect-t{font-size:12px;color:var(--muted);margin:6px 0 2px}
.danger{background:var(--bad-soft);color:var(--bad)}
.hidden{display:none!important}

/* ===== v2 ===== */
.tabs button{font-size:13px;padding:9px 4px}
.alerts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:11px 13px;border-radius:16px;border:1px solid transparent}
.alert .ic{font-size:17px;line-height:1.25}
.alert b{font-weight:700}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.amber{background:var(--amber-soft);color:var(--amber)}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.y27{background:linear-gradient(135deg,#2B1B55,#5B21B6);color:#fff;border:0}
.y27 h2{color:#E9DDFF}
.y27 .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.y27 .cmp > div{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px}
.y27 .cmp > div.hi{background:#fff;color:#3B1A86}
.y27 .k{font-size:12px;opacity:.85}
.y27 .cmp > div.hi .k{color:#6B5A93;opacity:1}
.y27 .v{font-size:22px;font-weight:700}
.y27 .v small{font-size:12px;font-weight:500;opacity:.85}
.y27 .foot{font-size:12.5px;margin-top:10px;opacity:.95}
.y27 .cd{background:rgba(255,255,255,.18);color:#fff}
.cmpline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);padding:8px 0;border-top:1px dashed var(--line)}
.cmpline b{color:var(--ink)}
/* simulator */
.sim .big{font-size:34px;font-weight:700;text-align:center;line-height:1.1}
.sim .big small{font-size:14px;font-weight:500;color:var(--ink-2)}
.sim .sub{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.sim input[type=range]{direction:ltr;width:100%;margin:14px 0 4px;accent-color:var(--brand);height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chips button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.res > div{border-radius:18px;padding:12px;background:var(--surface-2)}
.res > div.n27{background:#2A1E47}
.res .k{font-size:12px;color:var(--muted)}
.res .v{font-size:24px;font-weight:700}
.res .v small{font-size:12px;font-weight:500;color:var(--ink-2)}
.res .t{font-size:12px;margin-top:4px}
table.bd{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table.bd th{font-weight:600;color:var(--muted);font-size:12px;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
table.bd th:first-child,table.bd td:first-child{text-align:right}
table.bd td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
table.bd tr.tot td{font-weight:700;border-bottom:0}
.save{font-size:13px;padding:10px 12px;border-radius:14px;background:var(--good-soft);color:var(--good);margin-top:12px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minis .kpi{background:var(--surface-2);border-radius:16px;padding:10px 12px}
.anom{color:var(--warn);font-weight:700}

/* ===== v2.1 عمق ===== */
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}
.kpis .kpi,.minis .kpi,.res > div{background:rgba(255,255,255,.06)}
.trio .kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}
.iconbtn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.addbtn{height:42px;border-radius:21px;border:0;background:#1E7BE6;color:#fff;font:inherit;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;cursor:pointer;box-shadow:0 4px 16px rgba(30,123,230,.35)}
.addbtn svg{width:18px;height:18px}
.tankcard{padding:16px 16px 18px}
.tankcard .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.tankcard .hd .sp{flex:1}
.tankcard .hd .pill{background:rgba(255,255,255,.1);color:#fff}
.tankcard .hd .pill.t3{background:rgba(255,154,82,.2);color:#FFC9A3}
.tankrow{display:flex;gap:16px;margin-top:14px}
.tank{position:relative;width:150px;height:270px;flex:none;border-radius:26px;background:rgba(255,255,255,.05);border:2px solid rgba(160,210,255,.28);overflow:hidden}
.tank .z3{position:absolute;left:0;right:0;top:0;background:rgba(255,154,82,.10)}
.tank .ln{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.28)}
.tank .proj{position:absolute;left:0;right:0;bottom:0;background:rgba(124,200,255,.08);border-top:2px dashed #FF9A52}
.tank .water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5CC8FF,#1E7BE6);transition:height .8s ease}
.tank .water.t3{background:linear-gradient(180deg,#FFB27D,#F2711C)}
.tank .wave{position:absolute;left:-50%;width:200%;height:12px;top:-10px;animation:wv 6s linear infinite}
@keyframes wv{to{transform:translateX(50%)}}
@media (prefers-reduced-motion: reduce){.tank .wave{animation:none}}
.tside{position:relative;flex:1;min-width:0;height:270px;font-size:12px;color:var(--ink-2)}
.tside .lb{position:absolute;right:0;transform:translateY(50%);white-space:nowrap;line-height:1.3}
.tside .lb b{color:#fff}
.tside .lb.o, .tside .lb.o b{color:#FFB27D}
.tside .now{position:absolute;right:0;bottom:0}
.tside .now .v{font-size:38px;font-weight:700;color:#fff;line-height:1}
.billrow{display:flex;align-items:flex-end;gap:10px;margin-top:18px}
.billrow .m{flex:1}
.billrow .k{font-size:13px;color:var(--ink-2)}
.billrow .v{font-size:40px;font-weight:700;line-height:1.05}
.billrow .v small{font-size:15px;font-weight:500;color:var(--ink-2)}
.billrow .s{text-align:left;font-size:12px;color:var(--ink-2);padding-bottom:6px}
.billrow .s b{display:block;font-size:18px;color:#fff}
.bsheet{position:fixed;inset:0;background:rgba(2,8,18,.6);display:none;align-items:flex-end;z-index:9}
.bsheet.on{display:flex}
.bsheet .in{background:#0F2744;border:1px solid rgba(255,255,255,.08);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
.bsheet h3{margin:0 0 6px;font-size:17px}
.bsheet .hint{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.rdin{width:100%;font:inherit;font-size:34px;font-weight:700;text-align:center;direction:ltr;padding:12px;border-radius:16px;border:1px solid rgba(160,210,255,.3);background:rgba(255,255,255,.06);color:#fff;letter-spacing:1px}
.rdin:focus,.rdnote:focus{outline:2px solid #4DA3F5;outline-offset:1px}
.rdnote{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:14px;border:1px solid rgba(160,210,255,.2);background:rgba(255,255,255,.05);color:#fff;margin-bottom:6px}
.rdprev{min-height:44px;margin:10px 0 12px;font-size:14px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--ink-2)}
.rdprev b{color:#fff}
.rdprev.bad{background:var(--bad-soft);color:var(--bad)}
.rdprev.warn{background:var(--warn-soft);color:var(--warn)}
.btn.ghost2{background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.55}

<script src="config.js"></script>
<script>
/* ============ الإعدادات ============ */
const CONFIG = {
  // رابط /exec محفوظ في ملف config.js (ما يتغير مع التحديثات)
  API_URL: (window.MIYAHI_API_URL || 'PASTE_YOUR_EXEC_URL_HERE').trim(),
  VERSION: '2.1.0'
};

/* ============ تحديث تلقائي: إذا نزلت نسخة جديدة على GitHub يحدّث نفسه ============ */
async function checkUpdate(){
  try{
    const r = await fetch('version.json?_=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(!v || v === CONFIG.VERSION) return;
    const key = 'bsw_upd_' + v;
    if(sessionStorage.getItem(key)) return;           // منع التكرار لو ما تحدث الملف بعد
    sessionStorage.setItem(key, '1');
    showBanner('🔄 تحديث جديد (v' + v + ') — جاري التحميل…');
    if('caches' in window){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update();
    setTimeout(() => location.reload(), 600);
  }catch(e){}
}

const SECTIONS = [
  ['period','الرئيسية: الفترة الحالية'],['alerts','الرئيسية: التنبيهات'],['y27','الرئيسية: أثر تعرفة 2027'],
  ['reading','الرئيسية: آخر قراءة'],['lastBill','الرئيسية: آخر فاتورة رسمية'],
  ['chartCons','التحليل: الاستهلاك الشهري'],['chart27','التحليل: الفاتورة الحالية مقابل 2027'],['chartRate','التحليل: المعدل اليومي'],
  ['fills','التحليل: عادات التعبئة'],['stats','التحليل: إحصائيات 12 شهر'],['meterLog','السجل: سجل العداد'],['bills','السجل: الفواتير']
];
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let settings = Object.assign({ theme:'auto', hidden:[] }, LS.get('bsw_settings', {}));
let auth = LS.get('bsw_auth', null);
let DATA = null;
const isDemo = /[?&]demo/.test(location.search) || !/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);

const $ = s => document.querySelector(s);
const r2 = x => Math.round((Number(x) + 1e-9) * 100) / 100;
const f2 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(2);
const f3 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(3);
const f1 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(1);
const f0 = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MSHORT = ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function monthName(ym){ const m = /^(\d{4})-(\d{2})/.exec(ym || ''); return m ? MONTHS[+m[2]-1] + ' ' + m[1] : (ym || '—'); }
function monthShort(ym){ const m = /^(\d{4})-(\d{2})/.exec(ym || ''); return m ? MSHORT[+m[2]-1] : ''; }
function dShort(ymd){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || ''); return m ? (+m[3]) + '/' + (+m[2]) : ymd; }
function toDate(ymd){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function ymdOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(ymd, n){ const d = toDate(ymd); d.setDate(d.getDate() + n); return ymdOf(d); }
function daysSince(ymd){ const a = toDate(ymd); if(!a) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - a) / 864e5); }
function sinceText(n){ if(n == null) return ''; if(n <= 0) return 'اليوم'; if(n === 1) return 'أمس'; if(n === 2) return 'قبل يومين'; return n <= 10 ? `قبل ${n} أيام` : `قبل ${n} يوم`; }
const isT3 = t => /الثالثة|الرابعة|الخامسة/.test(t || '');
function statusChip(s){
  const map = {'مدفوعة':'chip-paid','صدرت':'chip-issued','بانتظار الفاتورة':'chip-wait','جارية':'chip-open'};
  return `<span class="pill ${map[s] || 'chip-open'}">${esc(s || '—')}</span>`;
}

/* ============ التعرفة (نفس حسبة الشيت) ============ */
const DEFAULT_TARIFF = {
  old: { lim:[15,30,45,60], rate:[0.1,1,3,4,6], sewerPct:0.5, meter30:5, vat:0.15 },
  n27: { eff:'2027-01-01', lim:[15,30,45], water:[1,2,4,6], sewer:[0.5,1,2,3], fixed30:30, vat:0.15 }
};
const T = () => (DATA && DATA.tariff && DATA.tariff.old && DATA.tariff.n27) ? DATA.tariff : DEFAULT_TARIFF;
function tiered(c, L, rates){ // L: حدود متصاعدة، rates أطول بواحد
  let v = Math.min(c, L[0]) * rates[0];
  for(let i = 1; i < L.length; i++) v += Math.min(Math.max(c - L[i-1], 0), L[i] - L[i-1]) * rates[i];
  return v + Math.max(c - L[L.length-1], 0) * rates[L.length];
}
function billOld(c, d){
  const t = T().old, k = d / 30, L = t.lim.map(x => x * k);
  const w = r2(tiered(c, L, t.rate)), s = r2(w * t.sewerPct), m = r2(t.meter30 * k);
  const vat = r2(w * t.vat) + r2(s * t.vat) + r2(m * t.vat);
  return { w, s, m, vat:r2(vat), total:r2(w + s + m + vat), tier:tierName(c, L, true) };
}
function billNew(c, d){
  const t = T().n27, k = d / 30, L = t.lim.map(x => x * k);
  const w = r2(tiered(c, L, t.water)), s = r2(tiered(c, L, t.sewer)), m = r2(t.fixed30 * k);
  const vat = r2(w * t.vat) + r2(s * t.vat) + r2(m * t.vat);
  return { w, s, m, vat:r2(vat), total:r2(w + s + m + vat), tier:tierName(c, L, false) };
}
function tierName(c, L, five){
  const n = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة'];
  for(let i = 0; i < L.length; i++) if(c <= L[i]) return n[i];
  return n[L.length];
}
function perM3(tier, isNew){ // كلفة م³ إضافي شامل الصرف والضريبة
  const t = T(); const i = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة'].indexOf(tier);
  if(isNew) return (t.n27.water[i] + t.n27.sewer[i]) * (1 + t.n27.vat);
  return t.old.rate[i] * (1 + t.old.sewerPct) * (1 + t.old.vat);
}
const effDate = () => T().n27.eff || '2027-01-01';

/* ============ تحليلات من سجل العداد ============ */
function meterAt(ymd){ // أعلى قراءة بتاريخ قبل ymd
  let best = null; (DATA.meter || []).forEach(m => { if(m.date < ymd && (best == null || m.value > best)) best = m.value; }); return best;
}
function intervals(){ return (DATA.meter || []).filter(m => m.diff != null && m.diff >= 0 && m.days >= 1); }
function median(a){ if(!a.length) return null; const s = a.slice().sort((x,y)=>x-y); const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2; }
function anomaly(){
  const iv = intervals(); if(iv.length < 6) return null;
  const med = median(iv.slice(-21, -1).map(m => m.rate));
  const last = iv[iv.length - 1];
  if(med && last.rate > Math.max(1.5, med * 2)) return { last, med };
  return null;
}
function samePoint(c){
  const prev = (DATA.bills || []).filter(b => b.status !== 'جارية').slice(-1)[0];
  if(!prev || !c.start) return null;
  const s0 = meterAt(prev.start), s1 = meterAt(addDays(prev.start, c.elapsed));
  if(s0 == null || s1 == null || s1 < s0) return null;
  return { prev, cons: s1 - s0 };
}

/* ============ مظهر واحد (عمق) ============ */
document.documentElement.removeAttribute('data-theme');

/* ============ الرسوم ============ */
function barChart(items, o){
  // items: [{label, value, color, tip, faded}]
  const W = 340, H = 170, pl = 30, pr = 6, pt = 14, pb = 22;
  const vals = items.map(i => i.value || 0);
  let max = Math.max(...vals, o.ref || 0) * 1.12 || 1;
  const step = niceStep(max / 3); max = Math.ceil(max / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, n = items.length;
  const gap = 4, bw = Math.max(4, Math.min(22, iw / n - gap));
  const y = v => pt + ih - (v / max) * ih;
  // RTL: الأحدث يمين
  const x = i => pl + iw - (i + 1) * (iw / n) + (iw / n - bw) / 2;
  let s = '';
  for(let v = 0; v <= max + 1e-9; v += step){
    s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="axis" x="${pl-5}" y="${y(v)+3}" text-anchor="end">${+v.toFixed(2)}</text>`;
  }
  items.forEach((it, i) => {
    const v = it.value || 0, bh = Math.max(0, ih - (y(v) - pt)), bx = x(i), by = y(v), r = Math.min(4, bw/2, bh);
    const path = bh <= 0 ? '' : `M${bx},${pt+ih} V${by+r} Q${bx},${by} ${bx+r},${by} H${bx+bw-r} Q${bx+bw},${by} ${bx+bw},${by+r} V${pt+ih} Z`;
    s += `<path class="bar" d="${path}" fill="${it.color}" ${it.faded ? 'fill-opacity=".45" stroke="'+it.color+'" stroke-dasharray="3 2"' : ''}/>`;
    s += `<rect class="hit" data-i="${i}" x="${bx - gap/2}" y="${pt}" width="${bw + gap}" height="${ih + pb}"/>`;
    if(it.label && (n <= 14 || i % 2 === 0)) s += `<text class="axis" x="${bx + bw/2}" y="${H-6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  if(o.ref){
    s += `<line class="ref" x1="${pl}" x2="${W-pr}" y1="${y(o.ref)}" y2="${y(o.ref)}"/>`;
  }
  const id = 'c' + Math.random().toString(36).slice(2,8);
  setTimeout(() => wireTips(id, items, x, bw, W), 0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="${esc(o.title||'')}">${s}</svg><div class="tip"></div></div>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function wireTips(id, items, x, bw, W){
  const el = document.getElementById(id); if(!el) return;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  const show = i => {
    const it = items[i]; if(!it) return;
    tip.innerHTML = it.tip; const sc = svg.getBoundingClientRect().width / W;
    const cx = (x(i) + bw/2) * sc; tip.style.left = cx + 'px'; tip.style.right = 'auto';
    tip.style.transform = `translate(${cx < 70 ? '0' : cx > svg.getBoundingClientRect().width - 70 ? '-100%' : '-50%'},-100%)`;
    tip.style.top = '8px'; tip.classList.add('on');
  };
  el.querySelectorAll('.hit').forEach(h => {
    h.addEventListener('pointerenter', () => show(+h.dataset.i));
    h.addEventListener('click', e => { e.stopPropagation(); show(+h.dataset.i); });
  });
  el.addEventListener('pointerleave', () => tip.classList.remove('on'));
  document.addEventListener('click', () => tip.classList.remove('on'));
}



function groupedChart(items, o){
  // items: [{label, a, b, tip}] — عمودين لكل شهر على نفس المحور (نفس الوحدة)
  const W = 340, H = 170, pl = 32, pr = 6, pt = 14, pb = 22;
  let max = Math.max(...items.map(i => Math.max(i.a || 0, i.b || 0))) * 1.1 || 1;
  const step = niceStep(max / 3); max = Math.ceil(max / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, n = items.length, slot = iw / n;
  const bw = Math.max(3, Math.min(10, slot / 2 - 2));
  const y = v => pt + ih - (v / max) * ih;
  const x = i => pl + iw - (i + 1) * slot + (slot - (bw * 2 + 2)) / 2;
  const bar = (bx, v, col) => { const by = y(v), bh = pt + ih - by, r = Math.min(3, bw/2, bh); if(bh <= 0) return '';
    return `<path d="M${bx},${pt+ih} V${by+r} Q${bx},${by} ${bx+r},${by} H${bx+bw-r} Q${bx+bw},${by} ${bx+bw},${by+r} V${pt+ih} Z" fill="${col}"/>`; };
  let s = '';
  for(let v = 0; v <= max + 1e-9; v += step){
    s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-5}" y="${y(v)+3}" text-anchor="end">${+v.toFixed(0)}</text>`;
  }
  items.forEach((it, i) => {
    const bx = x(i);
    s += bar(bx, it.a, o.colA) + bar(bx + bw + 2, it.b, o.colB);
    s += `<rect class="hit" data-i="${i}" x="${pl + iw - (i + 1) * slot}" y="${pt}" width="${slot}" height="${ih + pb}"/>`;
    s += `<text class="axis" x="${bx + bw + 1}" y="${H-6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  const id = 'g' + Math.random().toString(36).slice(2,8);
  const cx = i => x(i) - bw/2;
  setTimeout(() => wireTips(id, items, cx, bw * 2 + 2, W), 0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="${esc(o.title||'')}">${s}</svg><div class="tip"></div></div>`;
}

/* ============ العدّاد الدائري (مثل الأيقونة) ============ */
function gauge(c){
  const W = 300, H = 162, cx = 150, cy = 150, R = 116, SW = 18;
  const lim1 = c.lim1 || 15, lim2 = c.lim2 || c.tier2Limit || 30, lim3 = c.lim3 || 45;
  const max = Math.max(lim3, (c.projCons || 0) * 1.05, (c.cons || 0) * 1.05);
  const clamp = v => Math.max(0, Math.min(max, v || 0));
  const pt = (v, r = R) => { const a = Math.PI * (1 - clamp(v) / max); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (a, b, r = R) => { if(b - a <= 0.0001) return ''; const p = pt(a, r), q = pt(b, r); return `M${p[0].toFixed(1)},${p[1].toFixed(1)} A${r},${r} 0 0 1 ${q[0].toFixed(1)},${q[1].toFixed(1)}`; };
  const gap = max * 0.008;
  const zones = [[0, lim1, '#B9ECFF'], [lim1, lim2, '#FFFFFF'], [lim2, max, '#FFA94D']];
  let s = '';
  zones.forEach(([a, b, col], i) => {
    const a2 = i ? a + gap : a, b2 = i < 2 ? b - gap : b;
    s += `<path d="${arc(a2, b2)}" stroke="${col}" stroke-opacity=".28" stroke-width="${SW}" fill="none" stroke-linecap="${i === 0 || i === 2 ? 'round' : 'butt'}"/>`;
  });
  const cons = clamp(c.cons);
  zones.forEach(([a, b, col], i) => {
    const a2 = i ? a + gap : a, b2 = Math.min(i < 2 ? b - gap : b, cons);
    if(b2 > a2) s += `<path d="${arc(a2, b2)}" stroke="${col}" stroke-width="${SW}" fill="none" stroke-linecap="${i === 0 ? 'round' : 'butt'}"/>`;
  });
  // نقطة الاستهلاك الحالي
  const e = pt(cons); s += `<circle cx="${e[0]}" cy="${e[1]}" r="11" fill="#fff" stroke="${cons > lim2 ? '#F2711C' : '#1C64DA'}" stroke-width="4"/>`;
  // علامة المتوقع
  if(c.projCons){ const p1 = pt(c.projCons, R - SW/2 - 6), p2 = pt(c.projCons, R + SW/2 + 6);
    s += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#fff" stroke-width="3" stroke-dasharray="3 2" stroke-linecap="round"/>`; }
  // أرقام الحدود
  [[lim1, f1(lim1)], [lim2, f1(lim2)]].forEach(([v, t]) => { const p = pt(v, R + SW/2 + 13);
    s += `<text class="lbl" x="${p[0]}" y="${p[1] + 3}" text-anchor="middle">${t}</text>`; });
  return `<svg class="gauge" viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="استهلاك الفترة مقابل حدود الشرائح">${s}</svg>`;
}

        <div class="kpi"><div class="k">إجمالي الاستهلاك</div><div class="v"><span class="num">${f1(st.totalCons)}</span> <small>م³</small></div></div>

      <div class="row" style="margin-top:6px"><span class="l">أشهر دخلت الشريحة الثالثة</span><span class="r num" style="color:var(--warn)">${st.tier3Months ?? 0}</span></div>

function render(){
  const D = DATA; if(!D) return;
  const hidden = new Set(settings.hidden);
  $('#updated').textContent = 'آخر تحديث ' + (D.generatedAt || '—') + (isDemo ? ' · تجريبي' : '');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  let h = TAB === 'sim' ? simHTML(D) : TAB === 'analysis' ? analysisHTML(D, hidden) : TAB === 'log' ? logHTML(D, hidden) : homeHTML(D, hidden);
  if(!h) h = `<section class="card" style="text-align:center;color:var(--muted)">كل أقسام هذي الصفحة مخفية — فعّلها من الإعدادات</section>`;
  $('#app').innerHTML = h;
  document.querySelectorAll('[data-more]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.more === 'meter') $('#meterList').innerHTML = meterRows(D.meter.slice().reverse());
    else $('#billList').innerHTML = billRows(D.bills.slice().reverse());
    b.remove();
  }));
  if(TAB === 'sim'){
    const r = $('#simR');
    r.addEventListener('input', () => { SIM = { daily: +r.value, days: SIM?.days || D.current.days || 30 }; renderSimKeepFocus(); });
    $('#simP').addEventListener('click', e => { const v = e.target.closest('button')?.dataset.v; if(v){ SIM = { daily: +v, days: SIM?.days || D.current.days || 30 }; render(); } });
    $('#simD').addEventListener('click', e => { const d = e.target.closest('button')?.dataset.d; if(d){ SIM = { daily: SIM?.daily ?? D.current.daily, days: +d }; render(); } });
  }
}
function renderSimKeepFocus(){
  const v = $('#simR').value; render(); const r = $('#simR'); if(r){ r.value = v; r.focus({ preventScroll:true }); }
}
function meterRows(rows){
  const med = median(intervals().slice(-21).map(m => m.rate)) || 1;
  return rows.map(m => `<div class="it">
    <div class="a"><span class="num">${f3(m.value)}</span> م³</div>
    <div class="c">${m.diff != null ? '<span class="num">+' + f3(m.diff) + '</span>' : '—'}</div>
    <div class="b"><span class="num">${esc(m.date)}</span>${m.time ? ' · <span class="num">' + esc(m.time) + '</span>' : ''}${m.note ? ' · ' + esc(m.note) : ''}</div>
    <div class="d">${m.rate != null && m.days >= 1 ? '<span class="num ' + (m.rate > Math.max(1.5, med * 2) ? 'anom' : '') + '">' + f2(m.rate) + '</span>/يوم' : ''}</div>
  </div>`).join('');
}
function billRows(rows){
  return rows.map(b => {
    const amt = b.official != null ? b.official : b.calc;
    const n = b.n27 != null ? b.n27 : null;
    return `<div class="it">
      <div class="a">${esc(monthName(b.month))}</div>
      <div class="c"><span class="num">${f2(amt)}</span> ريال</div>
      <div class="b"><span class="num">${f2(b.cons)}</span> م³ · ${esc(b.tier)}${b.official == null ? ' · تقديري' : ''}${n != null ? ' · 2027: <span class="num">' + f2(n) + '</span>' : ''}</div>
      <div class="d">${statusChip(b.status)}</div>
    </div>`;
  }).join('');
}

async function load(){

  if(cached && !DATA){ DATA = cached; render(); }
  const btn = $('#btnRefresh'); btn.classList.add('spin');
  try{
    const res = await api(auth);
    if(res.ok){ DATA = res.data; LS.set('bsw_cache', DATA); showBanner(''); render(); }
    else if(res.code === 'auth' || res.code === 'nopin'){ LS.del('bsw_auth'); auth = null; openLock(res.message); }
    else showBanner(res.message || 'تعذر التحديث');
  }catch(e){
    showBanner(DATA ? 'غير متصل — تعرض آخر بيانات محفوظة' : 'تعذر الاتصال بالسكربت');
  }finally{ btn.classList.remove('spin'); }
}
async function api(a){
  const q = new URLSearchParams({ action:'data' });
  if(a.pin) q.set('pin', a.pin); if(a.key) q.set('key', a.key);
  q.set('_', Date.now());
  const r = await fetch(CONFIG.API_URL + '?' + q.toString(), { cache:'no-store' });
  return r.json();
}

/* ============ القفل ============ */
let pin = '';
function openLock(msg){ $('#lock').classList.add('on'); $('#pinErr').textContent = msg || ''; pin = ''; drawDots(); }
function drawDots(){ document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('f', i < pin.length)); }
function buildPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#pad').innerHTML = keys.map(k => k === '' ? '<span></span>' : `<button class="${k === '⌫' ? 'ghost' : ''}" data-k="${k}">${k}</button>`).join('');
  $('#pad').addEventListener('click', e => {
    const k = e.target.closest('button')?.dataset.k; if(!k) return;
    if(k === '⌫') pin = pin.slice(0, -1); else if(pin.length < 6) pin += k;
    drawDots(); if(pin.length === 6) tryAuth({ pin });
  });
}
async function tryAuth(a){
  $('#pinErr').textContent = '...';
  try{
    const res = await api(a);
    if(res.ok){
      auth = a; LS.set('bsw_auth', a); DATA = res.data; LS.set('bsw_cache', DATA);
      $('#lock').classList.remove('on'); $('#pinErr').textContent = ''; render();
    }else{
      $('#pinErr').textContent = res.message + (res.left != null ? ` (باقي ${res.left} محاولات)` : '');
      $('#dots').classList.add('shake'); setTimeout(() => $('#dots').classList.remove('shake'), 400);
      pin = ''; drawDots();
    }
  }catch(e){ $('#pinErr').textContent = 'تعذر الاتصال'; pin = ''; drawDots(); }
}
$('#btnForgot').addEventListener('click', () => $('#rec').classList.toggle('on'));
$('#btnRec').addEventListener('click', () => { const k = $('#recKey').value.trim(); if(k) tryAuth({ key:k }); });

/* ============ الخزان ============ */
function tankHTML(c){
  const lim1 = c.lim1 || 15, lim2 = c.lim2 || c.tier2Limit || 30, lim3 = c.lim3 || 45;
  const max = Math.max(lim3, (c.projCons || 0) * 1.08, (c.cons || 0) * 1.08);
  const pc = v => Math.max(0, Math.min(100, (v || 0) / max * 100));
  const t3now = (c.cons || 0) > lim2, t3 = isT3(c.tierProj);
  const projP = pc(c.projCons), consP = Math.max(2, pc(c.cons));
  const lbls = [
    [pc(lim2), `حد الثانية <b class="num">${f1(lim2)}</b>`, '']
  ];
  if(pc(lim1) > 38) lbls.push([pc(lim1), `حد الأولى <b class="num">${f1(lim1)}</b>`, '']);   // ما يتزاحم مع رقم الاستهلاك
  // علامة المتوقع إذا ما تتزاحم مع خط الثانية
  if(c.projCons && Math.abs(projP - pc(lim2)) > 7) lbls.push([projP, `المتوقع <b class="num">${f1(c.projCons)}</b>`, 'o']);
  return `<section class="card tankcard">
    <div class="hd"><span>${esc(monthName((c.start || '').slice(0,7)))} · اليوم <span class="num">${c.elapsed}</span> من <span class="num">${c.days}</span></span><span class="sp"></span>
      <span class="pill ${t3 ? 't3' : ''}">المتوقع: ${esc(c.tierProj)}</span></div>
    <div class="tankrow">
      <div class="tank" role="img" aria-label="استهلاك الفترة ${f2(c.cons)} م³ من حد الثانية ${f1(lim2)}">
        <div class="z3" style="height:${100 - pc(lim2)}%"></div>
        <div class="ln" style="bottom:${pc(lim1)}%"></div>
        <div class="ln" style="bottom:${pc(lim2)}%;border-top-color:rgba(255,180,125,.55)"></div>
        <div class="proj" style="height:${projP}%"></div>
        <div class="water ${t3now ? 't3' : ''}" style="height:${consP}%">
          <svg class="wave" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 Q12.5 0 25 6 T50 6 T75 6 T100 6 T125 6 T150 6 T175 6 T200 6 V12 H0 Z" fill="${t3now ? '#FFB27D' : '#5CC8FF'}"/></svg>
        </div>
      </div>
      <div class="tside">
        ${t3 ? `<div class="lb o" style="bottom:${100 - (100 - pc(lim2)) / 2}%"><b>الشريحة الثالثة</b></div>` : ''}
        ${lbls.map(([b, t, k]) => `<div class="lb ${k}" style="bottom:${b}%">${t}</div>`).join('')}
        <div class="now"><div>استهلاكك الآن</div><div class="v num">${f2(c.cons)}</div><div>م³ · <span class="num">${f2(c.daily)}</span> م³/يوم</div></div>
      </div>
    </div>
    <div class="billrow">
      <div class="m"><div class="k">الفاتورة المتوقعة</div><div class="v"><span class="num">${f2(c.billProj)}</span> <small>ريال</small></div></div>
      <div class="s">حتى الآن<b class="num">${f2(c.billNow)}</b></div>
    </div>
  </section>`;
}

/* ============ تسجيل قراءة من التطبيق ============ */
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 6000); }
function lastMeter(){ const m = (DATA && DATA.meter) || []; return m.length ? m[m.length - 1] : null; }
function parseReading(v){ return parseFloat(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[^0-9.]/g, '')); }
function openAdd(){
  if(isDemo){ toast('التسجيل يشتغل بعد ما تحط رابط /exec في config.js'); return; }
  if(!auth){ openLock(); return; }
  $('#rdIn').value = ''; $('#rdNote').value = ''; $('#rdErr').textContent = ''; previewReading();
  $('#addSheet').classList.add('on'); setTimeout(() => $('#rdIn').focus(), 120);
}
function previewReading(){
  const el = $('#rdPrev'), lm = lastMeter(), v = parseReading($('#rdIn').value);
  el.className = 'rdprev';
  if(!lm){ el.textContent = ''; return; }
  if(!(v > 0)){ el.innerHTML = `آخر قراءة <b class="num">${f3(lm.value)}</b> بتاريخ <span class="num">${esc(lm.date)}</span>`; return; }
  const d = v - lm.value;
  if(d < -0.0005){ el.classList.add('bad'); el.innerHTML = `الرقم أقل من آخر قراءة (<b class="num">${f3(lm.value)}</b>) — تأكد منه`; return; }
  const days = Math.max(1, daysSince(lm.date) || 0);
  if(d > 5) el.classList.add('warn');
  el.innerHTML = `+<b class="num">${f3(d)}</b> م³ منذ <span class="num">${esc(lm.date)}</span> · <span class="num">${f2(d / days)}</span> م³/يوم${d > 5 ? ' — زيادة كبيرة، تأكد من الرقم' : ''}`;
}
async function saveReading(){
  const v = parseReading($('#rdIn').value), lm = lastMeter();
  if(!(v > 0)){ $('#rdErr').textContent = 'اكتب القراءة'; return; }
  if(lm && v < lm.value - 0.0005){ $('#rdErr').textContent = 'القراءة أقل من آخر قراءة'; return; }
  const btn = $('#rdSave'); btn.disabled = true; btn.textContent = 'جاري الحفظ…'; $('#rdErr').textContent = '';
  const now = new Date();
  const body = Object.assign({ action:'appreading', reading:v, date: ymdOf(now),
    time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'), note: $('#rdNote').value.trim() }, auth);
  try{
    const r = await fetch(CONFIG.API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const res = await r.json();
    if(res.ok){
      $('#addSheet').classList.remove('on');
      if(res.data){ DATA = res.data; LS.set('bsw_cache', DATA); render(); } else load();
      toast(res.message || 'تم ✅');
    }else{
      $('#rdErr').textContent = res.message || 'ما تم الحفظ';
      if(res.code === 'auth'){ LS.del('bsw_auth'); auth = null; }
    }
  }catch(e){ $('#rdErr').textContent = 'تعذر الاتصال — تأكد من النت وجرب مرة ثانية'; }
  finally{ btn.disabled = false; btn.textContent = 'حفظ القراءة'; }
}
$('#btnAdd').addEventListener('click', openAdd);
$('#rdIn').addEventListener('input', previewReading);
$('#rdSave').addEventListener('click', saveReading);
$('#rdIn').addEventListener('keydown', e => { if(e.key === 'Enter') saveReading(); });
$('#rdCancel').addEventListener('click', () => $('#addSheet').classList.remove('on'));
$('#addSheet').addEventListener('click', e => { if(e.target.id === 'addSheet') $('#addSheet').classList.remove('on'); });

buildPad();
load();
if(!/[?&]demo/.test(location.search)){ checkUpdate(); document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); }); }
if('serviceWorker' in navigator && !isDemo) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
