<!doctype html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مياهي</title>
<meta name="description" content="متابعة عداد وفواتير الماء — قراءة فقط">
<meta name="theme-color" content="#1C64DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مياهي">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF5FC; --surface:#FFFFFF; --surface-2:#F3F8FD; --line:#DCE8F4;
  --ink:#0E2747; --ink-2:#47607E; --muted:#8299B3;
  --sky:#38BDF8; --brand:#1E6FE0; --brand-ink:#123B7A; --brand-soft:#E2EFFD;
  --warn:#F2711C; --warn-soft:#FEEBDC;
  --good:#16935A; --good-soft:#DFF5E9;
  --bad:#D13A3A; --bad-soft:#FCE4E4;
  --amber:#B7791F; --amber-soft:#FCF1DC;
  --bs:#5B21B6;
  --hero-a:#3CC2F8; --hero-b:#1C64DA;
  --t1:#8FD3F7; --t2:#2A86E8; --t3:#F2711C;
  --shadow:0 1px 2px rgba(14,39,71,.05),0 8px 24px rgba(30,111,224,.08);
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121F; --surface:#0F1D30; --surface-2:#14263D; --line:#1E334F;
    --ink:#E8F1FB; --ink-2:#AFC2D9; --muted:#7690AE;
    --sky:#5CCBFA; --brand:#5AA6F5; --brand-ink:#D3E7FC; --brand-soft:#15304F;
    --warn:#FF9248; --warn-soft:#3A2414;
    --good:#4CC98A; --good-soft:#10301F;
    --bad:#FF6F6F; --bad-soft:#3A1717;
    --amber:#F0B24A; --amber-soft:#36290F;
    --bs:#B794F6;
    --hero-a:#1A6FC7; --hero-b:#0E3A7A;
    --t1:#5BB8E8; --t2:#3D8CEB; --t3:#FF9248;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#0F1D30; --surface-2:#14263D; --line:#1E334F;
  --ink:#E8F1FB; --ink-2:#AFC2D9; --muted:#7690AE;
  --sky:#5CCBFA; --brand:#5AA6F5; --brand-ink:#D3E7FC; --brand-soft:#15304F;
  --warn:#FF9248; --warn-soft:#3A2414;
  --good:#4CC98A; --good-soft:#10301F;
  --bad:#FF6F6F; --bad-soft:#3A1717;
  --amber:#F0B24A; --amber-soft:#36290F;
  --bs:#B794F6;
  --hero-a:#1A6FC7; --hero-b:#0E3A7A;
  --t1:#5BB8E8; --t2:#3D8CEB; --t3:#FF9248;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
header.top img{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 8px rgba(30,111,224,.25)}
header.top .t{flex:1;min-width:0}
header.top h1{font-size:21px;margin:0;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:6px}
header.top h1 .bs{font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB02E,#F2711C);padding:1px 6px;border-radius:6px;letter-spacing:.5px}
header.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin:4px 0 6px;position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:12px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:500}
.tabs button.on{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-paid{background:var(--good-soft);color:var(--good)}
.chip-issued{background:var(--bad-soft);color:var(--bad)}
.chip-wait{background:var(--amber-soft);color:var(--amber)}
.chip-open{background:var(--brand-soft);color:var(--brand)}
.chip-t3{background:var(--warn-soft);color:var(--warn)}
.chip-ok{background:var(--good-soft);color:var(--good)}
/* hero */
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;border:0;position:relative;overflow:hidden;padding:16px 16px 18px}
.hero::after{content:"";position:absolute;inset:auto -10% -38px -10%;height:90px;background:radial-gradient(60% 60px at 50% 100%,rgba(255,255,255,.18),transparent);pointer-events:none}
.hero .hd{display:flex;align-items:center;gap:8px;font-size:13px}
.hero .hd .sp{flex:1}
.hero .hd .pill{background:rgba(255,255,255,.2);color:#fff}
.hero .hd .pill.t3{background:#FFF1E6;color:#C2410C}
.gauge{display:block;width:100%;max-width:300px;margin:4px auto 0;overflow:visible}
.gauge .lbl{fill:rgba(255,255,255,.85);font-size:10px;font-family:inherit}
.gcenter{text-align:center;margin-top:-58px;position:relative}
.gcenter .v{font-size:34px;font-weight:700;line-height:1}
.gcenter .v small{font-size:14px;font-weight:500;opacity:.85}
.gcenter .s{font-size:12px;opacity:.85;margin-top:4px}
.hero .bill{display:flex;gap:10px;margin-top:16px}
.hero .bill > div{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}
.hero .bill .k{font-size:12px;opacity:.85}
.hero .bill .v{font-size:22px;font-weight:700}
.hero .bill .v small{font-size:12px;font-weight:500;opacity:.85}
.hero .bill > div.main{background:#fff;color:#123B7A}
.hero .bill > div.main .k{color:#47607E;opacity:1}
.status{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:18px;margin:12px 0}
.status b{font-weight:700}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.status .ic{font-size:18px;line-height:1.2}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.trio .kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);text-align:center}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:500;color:var(--ink-2)}
.kpi .d{font-size:11px;font-weight:600;margin-top:2px}
.up{color:var(--warn)} .down{color:var(--good)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .kpi{background:var(--surface-2);border-radius:16px;padding:10px 12px}
.reading{display:flex;align-items:center;gap:14px}
.reading .ic{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.reading .ic svg{width:24px;height:24px}
.reading .x{flex:1;min-width:0}
.reading .v{font-size:24px;font-weight:700;line-height:1.2}
.reading .v small{font-size:13px;font-weight:500;color:var(--ink-2)}
.reading .m{font-size:12px;color:var(--muted)}
.remind{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:14px;background:var(--amber-soft);color:var(--amber)}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:6px;direction:ltr}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--t2);min-height:3px}
.bars i.t3{background:var(--t3)} .bars i.cur{opacity:.45;outline:1.5px dashed var(--t2);outline-offset:-1.5px}
.bars-l{display:flex;gap:6px;direction:ltr;font-size:10px;color:var(--muted);margin-top:4px}
.bars-l span{flex:1;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:10px}
.row:first-of-type{border-top:0}
.row .l{color:var(--ink-2);font-size:14px}
.row .r{font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .bar{cursor:pointer}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:9px;
  white-space:nowrap;transform:translate(50%,-100%);opacity:0;transition:opacity .12s;z-index:2;line-height:1.4}
.tip.on{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--warn);vertical-align:3px}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .a{font-weight:600}
.list .b{color:var(--muted);font-size:12px}
.list .c{text-align:left;font-weight:600}
.list .d{text-align:left;font-size:12px;color:var(--muted)}
.more{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 0 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
.banner{font-size:12px;padding:8px 12px;border-radius:12px;margin-top:8px;background:var(--amber-soft);color:var(--amber);display:none}
.banner.on{display:block}
/* lock */
#lock{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg),var(--surface-2));display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:10}
#lock.on{display:flex}
#lock img{width:96px;height:96px;border-radius:24px;margin-bottom:12px;box-shadow:0 8px 24px rgba(30,111,224,.3)}
#lock h1{margin:0;font-size:22px}
#lock p{margin:4px 0 18px;color:var(--muted);font-size:14px;text-align:center}
.dots{display:flex;gap:14px;direction:ltr;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.dots i.f{background:var(--brand)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:8px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:26px;font-weight:500;cursor:pointer;box-shadow:var(--shadow)}
.pad button:active{background:var(--brand-soft)}
.pad .ghost{border:0;background:none;box-shadow:none;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;margin-top:18px;cursor:pointer}
.rec{display:none;width:100%;max-width:320px;margin-top:12px}
.rec.on{display:block}
.rec input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;direction:ltr;text-align:center}
.btn{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
/* settings sheet */
#sheet{position:fixed;inset:0;background:rgba(5,10,20,.45);display:none;align-items:flex-end;z-index:9}
#sheet.on{display:flex}
#sheet .in{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:17px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tog input{width:44px;height:26px;accent-color:var(--brand)}
.sect-t{font-size:12px;color:var(--muted);margin:6px 0 2px}
.danger{background:var(--bad-soft);color:var(--bad)}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img src="icon-192.png" alt="">
    <div class="t">
      <h1>مياهي <span class="bs">BS</span></h1>
      <div class="sub" id="updated">—</div>
    </div>
    <button class="iconbtn" id="btnRefresh" aria-label="تحديث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <nav class="tabs" id="tabs"><button data-t="home">الرئيسية</button><button data-t="charts">الرسوم</button><button data-t="log">السجل</button></nav>
  <div class="banner" id="banner"></div>
  <main id="app"></main>
  <footer>
    <div>مياهي <span class="num" id="ver"></span> · قراءة فقط من Bs-Water_Bills</div>
    <div>فكرة وتطوير: <span class="num">bsshfi@gmail.com</span></div>
  </footer>
</div>

<!-- Lock screen -->
<div id="lock">
  <img src="icon-192.png" alt="">
  <h1>مياهي</h1>
  <p id="lockMsg">ادخل رمز PIN (6 أرقام)</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="err" id="pinErr"></div>
  <div class="pad" id="pad"></div>
  <button class="linkbtn" id="btnForgot">نسيت الرمز؟</button>
  <div class="rec" id="rec">
    <input id="recKey" placeholder="رمز الاسترجاع" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="btnRec">دخول برمز الاسترجاع</button>
  </div>
</div>

<!-- Settings -->
<div id="sheet">
  <div class="in">
    <h3>الإعدادات</h3>
    <div class="sect-t">المظهر</div>
    <div class="seg" id="themeSeg">
      <button data-v="auto">تلقائي</button><button data-v="light">فاتح</button><button data-v="dark">داكن</button>
    </div>
    <div class="sect-t">الأقسام الظاهرة</div>
    <div id="secToggles"></div>
    <button class="btn danger" id="btnLogout" style="margin-top:16px">قفل التطبيق وحذف الرمز من الجهاز</button>
    <button class="btn" id="btnClose">تم</button>
  </div>
</div>

<script>
/* ============ الإعدادات ============ */
const CONFIG = {
  // الصق هنا رابط /exec حق سكربت Bs-Water_Bills
  API_URL: 'https://script.google.com/macros/s/AKfycbyJVQAPojcEp9_o5l0JZzwrMbmExp6nBAuNv1P3fH7Oow6ygaZbRND_jxgzOglWhV5M/exec',
  VERSION: '1.1.0'
};

const SECTIONS = [
  ['period','الرئيسية: الفترة الحالية'],['reading','الرئيسية: آخر قراءة'],['lastBill','الرئيسية: آخر فاتورة رسمية'],['mini','الرئيسية: آخر 6 أشهر'],['chartCons','رسم: الاستهلاك الشهري'],
  ['chartAmount','رسم: مبلغ الفاتورة'],['chartRate','رسم: المعدل اليومي'],['stats','إحصائيات 12 شهر'],
  ['meterLog','سجل العداد'],['bills','الفواتير']
];
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let settings = Object.assign({ theme:'auto', hidden:[] }, LS.get('bsw_settings', {}));
let auth = LS.get('bsw_auth', null);   // {pin} أو {key}
let DATA = null;
const isDemo = /[?&]demo/.test(location.search) || !/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);

const $ = s => document.querySelector(s);
const f2 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(2);
const f3 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(3);
const f1 = n => n == null || isNaN(n) ? '—' : Number(n).toFixed(1);
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MSHORT = ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function monthName(ym){ const m = /^(\d{4})-(\d{2})/.exec(ym || ''); return m ? MONTHS[+m[2]-1] + ' ' + m[1] : (ym || '—'); }
function monthShort(ym){ const m = /^(\d{4})-(\d{2})/.exec(ym || ''); return m ? MSHORT[+m[2]-1] : ''; }
function dShort(ymd){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || ''); return m ? (+m[3]) + '/' + (+m[2]) : ymd; }
function daysSince(ymd){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || ''); if(!m) return null;
  const a = new Date(+m[1], +m[2]-1, +m[3]); const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((t - a) / 864e5);
}
function sinceText(n){ if(n == null) return ''; if(n <= 0) return 'اليوم'; if(n === 1) return 'أمس'; if(n === 2) return 'قبل يومين'; return n <= 10 ? `قبل ${n} أيام` : `قبل ${n} يوم`; }

/* ============ الرسوم ============ */
function barChart(items, o){
  // items: [{label, value, color, tip, faded}]
  const W = 340, H = 170, pl = 30, pr = 6, pt = 14, pb = 22;
  const vals = items.map(i => i.value || 0);
  let max = Math.max(...vals, o.ref || 0) * 1.12 || 1;
  const step = niceStep(max / 3); max = Math.ceil(max / step) * step;
  const iw = W - pl - pr, ih = H - pt - pb, n = items.length;
  const gap = 4, bw = Math.max(4, Math.min(22, iw / n - gap));
  const y = v => pt + ih - (v / max) * ih;
  // RTL: الأحدث يمين
  const x = i => pl + iw - (i + 1) * (iw / n) + (iw / n - bw) / 2;
  let s = '';
  for(let v = 0; v <= max + 1e-9; v += step){
    s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="axis" x="${pl-5}" y="${y(v)+3}" text-anchor="end">${+v.toFixed(2)}</text>`;
  }
  items.forEach((it, i) => {
    const v = it.value || 0, bh = Math.max(0, ih - (y(v) - pt)), bx = x(i), by = y(v), r = Math.min(4, bw/2, bh);
    const path = bh <= 0 ? '' : `M${bx},${pt+ih} V${by+r} Q${bx},${by} ${bx+r},${by} H${bx+bw-r} Q${bx+bw},${by} ${bx+bw},${by+r} V${pt+ih} Z`;
    s += `<path class="bar" d="${path}" fill="${it.color}" ${it.faded ? 'fill-opacity=".45" stroke="'+it.color+'" stroke-dasharray="3 2"' : ''}/>`;
    s += `<rect class="hit" data-i="${i}" x="${bx - gap/2}" y="${pt}" width="${bw + gap}" height="${ih + pb}"/>`;
    if(it.label && (n <= 14 || i % 2 === 0)) s += `<text class="axis" x="${bx + bw/2}" y="${H-6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  if(o.ref){
    s += `<line class="ref" x1="${pl}" x2="${W-pr}" y1="${y(o.ref)}" y2="${y(o.ref)}"/>`;
  }
  const id = 'c' + Math.random().toString(36).slice(2,8);
  setTimeout(() => wireTips(id, items, x, bw, W), 0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="${esc(o.title||'')}">${s}</svg><div class="tip"></div></div>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function wireTips(id, items, x, bw, W){
  const el = document.getElementById(id); if(!el) return;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  const show = i => {
    const it = items[i]; if(!it) return;
    tip.innerHTML = it.tip; const sc = svg.getBoundingClientRect().width / W;
    const cx = (x(i) + bw/2) * sc; tip.style.left = cx + 'px'; tip.style.right = 'auto';
    tip.style.transform = `translate(${cx < 70 ? '0' : cx > svg.getBoundingClientRect().width - 70 ? '-100%' : '-50%'},-100%)`;
    tip.style.top = '8px'; tip.classList.add('on');
  };
  el.querySelectorAll('.hit').forEach(h => {
    h.addEventListener('pointerenter', () => show(+h.dataset.i));
    h.addEventListener('click', e => { e.stopPropagation(); show(+h.dataset.i); });
  });
  el.addEventListener('pointerleave', () => tip.classList.remove('on'));
  document.addEventListener('click', () => tip.classList.remove('on'));
}

/* ============ العدّاد الدائري (مثل الأيقونة) ============ */
function gauge(c){
  const W = 300, H = 162, cx = 150, cy = 150, R = 116, SW = 18;
  const lim1 = c.lim1 || 15, lim2 = c.lim2 || c.tier2Limit || 30, lim3 = c.lim3 || 45;
  const max = Math.max(lim3, (c.projCons || 0) * 1.05, (c.cons || 0) * 1.05);
  const clamp = v => Math.max(0, Math.min(max, v || 0));
  const pt = (v, r = R) => { const a = Math.PI * (1 - clamp(v) / max); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (a, b, r = R) => { if(b - a <= 0.0001) return ''; const p = pt(a, r), q = pt(b, r); return `M${p[0].toFixed(1)},${p[1].toFixed(1)} A${r},${r} 0 0 1 ${q[0].toFixed(1)},${q[1].toFixed(1)}`; };
  const gap = max * 0.008;
  const zones = [[0, lim1, '#B9ECFF'], [lim1, lim2, '#FFFFFF'], [lim2, max, '#FFA94D']];
  let s = '';
  zones.forEach(([a, b, col], i) => {
    const a2 = i ? a + gap : a, b2 = i < 2 ? b - gap : b;
    s += `<path d="${arc(a2, b2)}" stroke="${col}" stroke-opacity=".28" stroke-width="${SW}" fill="none" stroke-linecap="${i === 0 || i === 2 ? 'round' : 'butt'}"/>`;
  });
  const cons = clamp(c.cons);
  zones.forEach(([a, b, col], i) => {
    const a2 = i ? a + gap : a, b2 = Math.min(i < 2 ? b - gap : b, cons);
    if(b2 > a2) s += `<path d="${arc(a2, b2)}" stroke="${col}" stroke-width="${SW}" fill="none" stroke-linecap="${i === 0 ? 'round' : 'butt'}"/>`;
  });
  // نقطة الاستهلاك الحالي
  const e = pt(cons); s += `<circle cx="${e[0]}" cy="${e[1]}" r="11" fill="#fff" stroke="${cons > lim2 ? '#F2711C' : '#1C64DA'}" stroke-width="4"/>`;
  // علامة المتوقع
  if(c.projCons){ const p1 = pt(c.projCons, R - SW/2 - 6), p2 = pt(c.projCons, R + SW/2 + 6);
    s += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#fff" stroke-width="3" stroke-dasharray="3 2" stroke-linecap="round"/>`; }
  // أرقام الحدود
  [[lim1, f1(lim1)], [lim2, f1(lim2)]].forEach(([v, t]) => { const p = pt(v, R + SW/2 + 13);
    s += `<text class="lbl" x="${p[0]}" y="${p[1] + 3}" text-anchor="middle">${t}</text>`; });
  return `<svg class="gauge" viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr" role="img" aria-label="استهلاك الفترة مقابل حدود الشرائح">${s}</svg>`;
}

function sparkBars(bills){
  const last = bills.slice(-6); if(!last.length) return '';
  const mx = Math.max(...last.map(b => b.cons || 0), 1);
  return `<div class="bars">${last.map(b => `<i class="${isT3(b.tier) ? 't3' : ''} ${b.status === 'جارية' ? 'cur' : ''}" style="height:${Math.max(4, (b.cons || 0) / mx * 100)}%" title="${esc(monthName(b.month))}: ${f2(b.cons)} م³"></i>`).join('')}</div>
    <div class="bars-l">${last.map(b => `<span>${monthShort(b.month)}</span>`).join('')}</div>`;
}

/* ============ البيانات ============ */
function showBanner(t){ const b = $('#banner'); b.textContent = t || ''; b.classList.toggle('on', !!t); }
async function load(){
  if(isDemo){ DATA = DEMO; render(); return; }
  if(!auth){ openLock(); return; }
  const cached = LS.get('bsw_cache', null);
  if(cached && !DATA){ DATA = cached; render(); }
  const btn = $('#btnRefresh'); btn.classList.add('spin');
  try{
    const res = await api(auth);
    if(res.ok){ DATA = res.data; LS.set('bsw_cache', DATA); showBanner(''); render(); }
    else if(res.code === 'auth' || res.code === 'nopin'){ LS.del('bsw_auth'); auth = null; openLock(res.message); }
    else showBanner(res.message || 'تعذر التحديث');
  }catch(e){
    showBanner(DATA ? 'غير متصل — تعرض آخر بيانات محفوظة' : 'تعذر الاتصال بالسكربت');
  }finally{ btn.classList.remove('spin'); }
}
async function api(a){
  const q = new URLSearchParams({ action:'data' });
  if(a.pin) q.set('pin', a.pin); if(a.key) q.set('key', a.key);
  q.set('_', Date.now());
  const r = await fetch(CONFIG.API_URL + '?' + q.toString(), { cache:'no-store' });
  return r.json();
}

/* ============ القفل ============ */
let pin = '';
function openLock(msg){
  $('#lock').classList.add('on'); $('#pinErr').textContent = msg || ''; pin = ''; drawDots();
}
function drawDots(){ document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('f', i < pin.length)); }
function buildPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#pad').innerHTML = keys.map(k => k === '' ? '<span></span>' : `<button class="${k === '⌫' ? 'ghost' : ''}" data-k="${k}">${k}</button>`).join('');
  $('#pad').addEventListener('click', e => {
    const k = e.target.closest('button')?.dataset.k; if(!k) return;
    if(k === '⌫') pin = pin.slice(0, -1); else if(pin.length < 6) pin += k;
    drawDots(); if(pin.length === 6) tryAuth({ pin });
  });
}
async function tryAuth(a){
  $('#pinErr').textContent = '...';
  try{
    const res = await api(a);
    if(res.ok){
      auth = a; LS.set('bsw_auth', a); DATA = res.data; LS.set('bsw_cache', DATA);
      $('#lock').classList.remove('on'); $('#pinErr').textContent = ''; render();
    }else{
      $('#pinErr').textContent = res.message + (res.left != null ? ` (باقي ${res.left} محاولات)` : '');
      $('#dots').classList.add('shake'); setTimeout(() => $('#dots').classList.remove('shake'), 400);
      pin = ''; drawDots();
    }
  }catch(e){ $('#pinErr').textContent = 'تعذر الاتصال'; pin = ''; drawDots(); }
}
$('#btnForgot').addEventListener('click', () => $('#rec').classList.toggle('on'));
$('#btnRec').addEventListener('click', () => { const k = $('#recKey').value.trim(); if(k) tryAuth({ key:k }); });

/* ============ الإعدادات ============ */
function openSheet(){
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.theme));
  $('#secToggles').innerHTML = SECTIONS.map(([k, t]) =>
    `<label class="tog"><span>${t}</span><input type="checkbox" data-s="${k}" ${settings.hidden.includes(k) ? '' : 'checked'}></label>`).join('');
  $('#sheet').classList.add('on');
}
$('#themeSeg').addEventListener('click', e => {
  const v = e.target.dataset.v; if(!v) return;
  settings.theme = v; LS.set('bsw_settings', settings); applyTheme(); openSheet();
});
$('#secToggles').addEventListener('change', e => {
  const k = e.target.dataset.s; if(!k) return;
  settings.hidden = settings.hidden.filter(x => x !== k); if(!e.target.checked) settings.hidden.push(k);
  LS.set('bsw_settings', settings); render();
});
$('#btnClose').addEventListener('click', () => $('#sheet').classList.remove('on'));
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
$('#btnLogout').addEventListener('click', () => {
  LS.del('bsw_auth'); LS.del('bsw_cache'); auth = null; DATA = null; $('#app').innerHTML = '';
  $('#sheet').classList.remove('on'); if(!isDemo) openLock();
});
$('#btnSettings').addEventListener('click', openSheet);
$('#tabs').addEventListener('click', e => { const t = e.target.closest('button')?.dataset.t; if(t) setTab(t); });
$('#btnRefresh').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && auth) load(); });
$('#ver').textContent = 'v' + CONFIG.VERSION;
